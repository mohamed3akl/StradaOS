  "requirements": [
    {
      "id": "REQ-001",
      "statement": "The home-screen music player has radio options.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-19T09:21:30.342Z",
      "updatedAt": "2026-11-19T09:21:30.342Z"
    },
    {
      "id": "REQ-002",
      "statement": "StradaOS runs the radio itself in the background: on head units whose factory radio offers a background tuner service (XY/PVE acloud com.acloud.stub.localradio RadioService), play and stop control the tuner directly without ever opening the radio app. Other units keep the earlier behaviour as a fallback.",
      "provenance": [
        {
          "type": "request"
        },
        {
          "type": "source",
          "source": "SRC-0001",
          "locator": "com.acloud.stub.localradio"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-19T09:21:30.342Z",
      "updatedAt": "2026-11-22T14:03:52.943Z"
    },
    {
      "id": "REQ-003",
      "statement": "From the home screen the user can move to the next or previous station, and keep a list of favourite stations in StradaOS.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-19T09:21:30.342Z",
      "updatedAt": "2026-11-22T14:03:52.943Z"
    },
    {
      "id": "REQ-004",
      "statement": "The home player shows the current radio frequency and lets the user switch FM / AM.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-22T14:03:52.943Z",
      "updatedAt": "2026-11-22T14:03:52.943Z"
    },
    {
      "id": "REQ-005",
      "statement": "Diagnostics keep the radio and Bluetooth event log across StradaOS restarts, so the evidence of a problem is not lost.",
      "provenance": [
        {
          "type": "request"
        },
        {
          "type": "source",
          "source": "SRC-0002",
          "locator": "Eventos"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-22T14:03:52.943Z",
      "updatedAt": "2026-11-22T14:03:52.943Z"
    }
  ],
  "acceptanceCriteria": [
    {
      "id": "AC-001",
      "requirement": "REQ-001",
      "statement": "The player card has a radio button that switches the player into radio mode and back; the mode is remembered and the player shows RADIO while it is on.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-19T09:21:30.342Z",
      "updatedAt": "2026-11-19T09:21:30.342Z"
    },
    {
      "id": "AC-002",
      "requirement": "REQ-002",
      "statement": "On a unit with the acloud radio service, play sends the tuner open command (method_open) to the radio service and stop sends close (method_close); the radio app's screen is never opened.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-19T09:21:30.342Z",
      "updatedAt": "2026-11-22T14:03:52.943Z"
    },
    {
      "id": "AC-003",
      "requirement": "REQ-002",
      "statement": "On units without that service, play/stop keep the previous behaviour (media key, open the radio app briefly, take audio focus to stop).",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-19T09:21:30.342Z",
      "updatedAt": "2026-11-22T14:03:52.943Z"
    },
    {
      "id": "AC-004",
      "requirement": "REQ-003",
      "statement": "Previous/next (buttons and swipe) seek down/up to the next station with signal on the direct tuner; on other units they send previous/next to the radio app.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-19T09:21:30.342Z",
      "updatedAt": "2026-11-22T14:03:52.943Z"
    },
    {
      "id": "AC-005",
      "requirement": "REQ-003",
      "statement": "Tapping the station opens a favourites list where the user saves the current frequency, tunes to a saved one, or removes it; favourites are stored per band in StradaOS settings.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-19T09:21:30.342Z",
      "updatedAt": "2026-11-22T14:03:52.943Z"
    },
    {
      "id": "AC-006",
      "requirement": "REQ-004",
      "statement": "The player shows the frequency (e.g. FM 101.1 MHz / AM 522 kHz) as StradaOS last tuned or as reported by the tuner, and an FM/AM control switches the band.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-22T14:03:52.943Z",
      "updatedAt": "2026-11-22T14:03:52.943Z"
    },
    {
      "id": "AC-007",
      "requirement": "REQ-005",
      "statement": "The event log is written to a file and reloaded at start, keeping the last 200 lines; tuner status messages are logged so the unit's message format can be learned from a diagnostic.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-22T14:03:52.943Z",
      "updatedAt": "2026-11-22T14:03:52.943Z"
    }
  ],
