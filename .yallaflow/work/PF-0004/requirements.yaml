    },
    {
      "id": "AC-002",
      "requirement": "REQ-002",
      "statement": "In radio mode, play sends a play command to the radio app in the background; if the radio does not start, StradaOS opens the radio app for about 2 seconds and returns to where the user was.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-19T09:21:30.342Z",
      "updatedAt": "2026-11-19T09:21:30.342Z"
    },
    {
      "id": "AC-003",
      "requirement": "REQ-002",
      "statement": "In radio mode, stop sends a pause command to the radio app and takes audio focus so the radio goes silent, without opening the radio app.",
      "provenance": [
        {
          "type": "request"
        }
      ],
      "status": "active",
      "recordedAt": "2026-11-19T09:21:30.342Z",
      "updatedAt": "2026-11-19T09:21:30.342Z"
    },
    {
      "id": "AC-004",
      "requirement": "REQ-003",
      "statement": "In radio mode, previous/next (buttons and swipe) send previous/next commands to the radio app, which on factory radios moves between saved presets.",
