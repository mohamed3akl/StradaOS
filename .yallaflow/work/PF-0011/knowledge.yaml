      "kind": "integration",
      "source": "implementation-runtime",
      "summary": "HERE APIs (*.hereapi.com) only accept TLS 1.2 with AES-GCM or SHA-256 cipher suites, which platform TLS lacks below Android 5; Net therefore routes *.hereapi.com through bundled Conscrypt on API < 21 (same trust manager), so HERE search and routing work on Android 4.x (verified on API 19). Other hosts keep the platform TLS path. Failures still fall back to OpenStreetMap with the reason in Nav.hereError. A built-in key for local builds comes from here.apiKey in git-ignored local.properties; the Settings key overrides it.",
