      "kind": "convention",
      "source": "implementation-runtime",
      "summary": "Arabic UI is right-to-left on Android 4.2+ (API 17+): I18n.applyConfig sets the configuration layout direction (all windows and dialogs), Main.place()/placeWrap() mirror absolute positions (gravity RIGHT + rightMargin), and code must use I18n.left()/right()/marginStart()/marginEnd() instead of fixed Gravity.LEFT/RIGHT or leftMargin. Media transport buttons (⏮▶⏭) stay in left-to-right order (placeLtr). Never touch a dialog window before show(): it crashes AlertDialog.",
