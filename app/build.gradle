plugins {
    id 'com.android.application'
}

// Firma de release: se toma de variables de entorno (GitHub Actions). Sin ellas, el APK de release
// queda sin firmar (así lo necesita F-Droid, que firma con su propia clave).
def ksPath = System.getenv('STRADAOS_KEYSTORE')

// Clave de HERE incluida en la app (solo compilaciones propias): se lee de local.properties (here.apiKey, archivo que
// no se sube a git) o de la variable STRADAOS_HERE_KEY. Sin ella (p. ej. GitHub Actions) queda vacía y la app usa la
// clave escrita en Ajustes u OpenStreetMap. La clave de Ajustes siempre tiene prioridad.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def hereKey = (localProps.getProperty('here.apiKey') ?: System.getenv('STRADAOS_HERE_KEY') ?: '').trim()

// Número de compilación para las versiones de prueba (así cada APK de prueba se distingue en Ajustes → Acerca de y en
// el diagnóstico): cantidad de commits + commit corto, y «-local» si se compiló con cambios sin guardar en git.
// Ejemplo: 2.17.0-prueba.152-eaac007. La versión normal (release) queda limpia: 2.17.0. Reglas: CONTRIBUTING.md.
def git = { List<String> args ->
    try {
        def p = (['git'] + args).execute(null, rootProject.projectDir)
        def out = p.inputStream.text.trim()
        p.waitFor()
        return p.exitValue() == 0 ? out : ''
    } catch (Throwable ignored) {
        return ''
    }
}
def buildNumber = git(['rev-list', '--count', 'HEAD']) ?: '0'
def commit = git(['rev-parse', '--short', 'HEAD'])
def localChanges = git(['status', '--porcelain', '--untracked-files=no']) ? '-local' : ''
def testSuffix = "-prueba.${buildNumber}" + (commit ? "-${commit}" : '') + localChanges

android {
    namespace 'com.stradaos.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stradaos.launcher'
        // Android 4.1+: el objetivo del proyecto es revivir pantallas de carro antiguas.
        minSdk 16
        // 28 a propósito: mantiene el comportamiento probado en pantallas viejas y nuevas.
        targetSdk 28
        // Al publicar una versión: subir versionName (reglas en CONTRIBUTING.md) y versionCode en 1.
        versionCode 47
        versionName '2.17.0'
        manifestPlaceholders = [appLabel: 'StradaOS']
        buildConfigField 'String', 'HERE_KEY', "\"${hereKey.replace('\\', '').replace('"', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (ksPath) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv('STRADAOS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('STRADAOS_KEY_ALIAS')
                keyPassword System.getenv('STRADAOS_KEY_PASSWORD')
                enableV1Signing true   // Android 4.x solo entiende la firma v1
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksPath) signingConfig signingConfigs.release
        }
        // Versión de prueba: se instala junto a la normal (otro paquete y otro nombre). En GitHub Actions se firma
        // con la misma llave que la normal para que cada prueba nueva se instale encima de la anterior.
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix testSuffix              // p. ej. -prueba.152-eaac007 (único en cada compilación)
            manifestPlaceholders = [appLabel: 'StradaOS Prueba']
            if (ksPath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // F-Droid: sin el bloque binario de metadatos de dependencias.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "StradaOS-${variant.versionName}.apk"
        }
    }
}

// API oculta de Android 4.0–4.3 (IRemoteControlDisplay) para leer la pista en reproducción.
// 1) El stub (src/hiddenapi) se compila solo como referencia: NO entra al APK; en el equipo se usa la clase real.
// 2) RcDisplay (src/legacy), la única clase que la extiende, se compila contra ese stub y se empaqueta en un jar
//    que sí entra al APK. El resto del código la carga por reflexión y nunca ve la API oculta.
def androidJar = files({ android.bootClasspath })
def stubsDir = layout.buildDirectory.dir('intermediates/hiddenapi/stubs')
def legacyDir = layout.buildDirectory.dir('intermediates/hiddenapi/legacy')

def compileStubs = tasks.register('compileHiddenApiStubs', JavaCompile) {
    source = fileTree('src/hiddenapi/java')
    classpath = androidJar
    destinationDirectory = stubsDir
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.compilerArgs += ['-Xlint:-options']
}
def compileLegacy = tasks.register('compileLegacyRc', JavaCompile) {
    dependsOn compileStubs
    source = files('src/legacy/java', 'src/main/java/com/stradaos/launcher/RcCallback.java')
    classpath = androidJar + files(stubsDir)
    destinationDirectory = legacyDir
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.compilerArgs += ['-Xlint:-options']
}
def legacyJar = tasks.register('legacyRcJar', Jar) {
    // solo las clases (antes también entraba previous-compilation-data.bin, el registro de compilación incremental de Gradle)
    from(compileLegacy.flatMap { it.destinationDirectory }) { exclude 'com/stradaos/launcher/RcCallback*' }
    archiveFileName = 'stradaos-legacy-rc.jar'
    destinationDirectory = layout.buildDirectory.dir('intermediates/hiddenapi')
}
tasks.named('preBuild') { dependsOn legacyJar }

dependencies {
    implementation files(layout.buildDirectory.file('intermediates/hiddenapi/stradaos-legacy-rc.jar')).builtBy(legacyJar)
    // TLS moderno (BoringSSL) para HERE en Android 4.x: sus servidores solo aceptan cifrados AES-GCM / SHA-256 que
    // Android trae desde la 5.0. 2.5.2 es la última versión que funciona desde Android 2.3 (las nuevas piden Android 5).
    // Solo se usa para *.hereapi.com en Android < 5 (ver Net.java). Licencia Apache-2.0.
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
